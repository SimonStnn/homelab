name: filebrowser

services:
  filebrowser:
    container_name: filebrowser
    image: filebrowser/filebrowser:latest
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - 8080:80
    volumes:
      - /mnt/sdcard/homelab-volumes/filebrowser-data:/database:rw
      - /mnt/sdcard/filebrowser-data:/srv:rw
    environment:
      - TZ=Europe/Brussels
    networks:
      - homelab
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:80/health",
        ]
      interval: 120s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  homelab:
    external: true
