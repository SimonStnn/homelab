name: n8n

services:
  postgres:
    container_name: n8n-postgres
    image: postgres:15
    restart: unless-stopped
    environment:
      - POSTGRES_DB=n8n
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=n8n_password
      - TZ=Europe/Brussels
    volumes:
      - /mnt/sdcard/homelab-volumes/n8n-postgres-data:/var/lib/postgresql/data:rw
    networks:
      - homelab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 120s
      timeout: 5s
      retries: 3

  n8n:
    container_name: n8n
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - 5678:5678
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=n8n_password # Match the one above
      - TZ=Europe/Brussels
      - N8N_SECURE_COOKIE=false
      # - WEBHOOK_URL=https://n8n.your-domain.com
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - /mnt/sdcard/homelab-volumes/n8n-data:/home/node/.n8n:rw
    networks:
      - homelab
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:5678/healthz || exit 1",
        ]
      interval: 120s
      timeout: 5s
      retries: 3

networks:
  homelab:
    external: true
