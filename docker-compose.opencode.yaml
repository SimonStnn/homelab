name: opencode

services:
  opencode:
    image: ghcr.io/anomalyco/opencode:latest
    container_name: opencode-web
    restart: unless-stopped
    working_dir: /workspace
    ports:
      - "4096:4096"
    volumes:
      - /mnt/sdcard/opencode:/workspace
      # Persists your OpenCode sessions, authentication, and configurations
      - opencode-data:/root/.local/share/opencode
      - /root/.config/opencode:/root/.config/opencode:rw
    command: ["web", "--hostname", "0.0.0.0", "--port", "4096"]
