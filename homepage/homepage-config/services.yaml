- Root:
  - Homelab PVE:
    - Proxmox VE:
        icon: proxmox.svg
        # href: https://10.250.3.220:8006/
        href: https://proxmox.lab/
        description: Proxmox VE Dashboard
        siteMonitor: https://10.250.3.220:8006/api2/json/nodes
        widget:
          type: proxmox
          url: https://10.250.3.220:8006
          username: {{HOMEPAGE_VAR_PROXMOX_TOKEN_ID}}
          password: {{HOMEPAGE_VAR_PROXMOX_TOKEN_SECRET}}
        #   node: pve-1 # optional
    - Pi-Hole:
        icon: pi-hole.svg
        href: https://dns.lab/admin/
        description: Network-wide ad blocker & DNS server
        siteMonitor: https://dns.lab/admin/img/favicons/favicon-16x16.png
    - Nginx Proxy Manager:
        icon: nginx-proxy-manager.svg
        href: https://proxy.lab/
        description: Reverse proxy management dashboard
        siteMonitor: https://proxy.lab/api/
        widget:
          type: npm
          url: https://proxy.lab/
          username: admin@admin.net
          password: jL3JP7Q!588*v3^d
    - Dockge:
        icon: dockge.svg
        href: https://dockge.lab/
        description: Docker GUI for Home Server
        siteMonitor: https://dockge.lab/status
    - Uptime Kuma:
        icon: uptime-kuma.svg
        href: https://kuma.lab/
        description: Uptime monitoring dashboard
        siteMonitor: https://kuma.lab/health
    - cAdvisor:
        icon: cadvisor.png
        href: https://cadvisor.lab/
        description: Container Monitoring
        siteMonitor: https://cadvisor.lab/healthz

  - Tailscale:
    - Tailscale Network:
        icon: tailscale.png
        href: https://login.tailscale.com/admin/machines
        description: All Tailscale devices on the Tailnet
        widget:
          type: customapi
          url: https://api.tailscale.com/api/v2/tailnet/-/devices
          headers:
            Authorization: "Bearer {{HOMEPAGE_VAR_TAILSCALE_API_KEY}}"
          display: dynamic-list
          mappings:
            items: devices
            name: name
            label: lastSeen
            format: date
            target: https://tailscale.com/admin/machines/{addresses.0}

